
name: Build GTA1 APK (Android 4)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          ZIP_FILE="GTA1_Kotlin_Android4.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project folder not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Find APK and Sign
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          keytool -genkeypair -noprompt \
            -keystore gta1-release.keystore \
            -alias gta1 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mypassword \
            -keypass mypassword \
            -dname "CN=GTA1, OU=Android, O=GTA1, L=Berlin, S=Berlin, C=DE"

          "$APKSIGNER" sign \
            --ks gta1-release.keystore \
            --ks-pass pass:mypassword \
            --key-pass pass:mypassword \
            --ks-key-alias gta1 \
            "$APK_PATH"

          mkdir -p signed
          cp "$APK_PATH" signed/GTA1-Android4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA1-Android4-APK
          path: ${{ env.PROJECT_DIR }}/signed/GTA1-Android4.apk
